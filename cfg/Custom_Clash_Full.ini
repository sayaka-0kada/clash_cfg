[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果


;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOSITE,apple
ruleset=🚀 手动选择,[]GEOSITE,github
ruleset=🎯 全球直连,[]GEOSITE,microsoft
;谷歌在国内可用的域名强制直连
ruleset=🎯 全球直连,[]GEOSITE,google-cn
;本项目收录的直连域名规则
ruleset=🎯 全球直连,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct.list,28800
ruleset=🎯 全球直连,https://raw.githubusercontent.com/sayaka-0kada/clash_cfg/refs/heads/dev/rule/Custom_Direct_Clash_Classical.list,28800
;Steam 下载 CDN 地址强制直连
ruleset=🎯 全球直连,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN.list,28800
;各大游戏平台下载域名强制直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名强制直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🇺🇸 美国节点,[]GEOSITE,spotify
ruleset=🇺🇸 美国节点,[]GEOSITE,tiktok
ruleset=🇯🇵 日本节点,[]GEOSITE,abema
ruleset=🇯🇵 日本节点,[]GEOSITE,dlsite
ruleset=🇯🇵 日本节点,[]GEOSITE,dmm
ruleset=🇯🇵 日本节点,[]GEOSITE,niconico
ruleset=🇼🇸 台湾节点,[]GEOSITE,bahamut
ruleset=🚀 手动选择,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy.list,28800
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🚀 手动选择,[]FINAL
;设置规则标志位结束

;设置节点分组标志位
;节点地区分组参考本项目推荐机场而设立
custom_proxy_group=🇬 谷歌服务`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇼🇸 台湾节点
custom_proxy_group=🤖 AI服务`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇼🇸 台湾节点
custom_proxy_group=🚀 手动选择`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇼🇸 台湾节点`[]🎯 全球直连
custom_proxy_group=🇭🇰 香港节点`url-test`(Hong Kong)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(United States)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(Japan)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇼🇸 台湾节点`url-test`(Taiwan)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT
;设置分组标志位

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true

